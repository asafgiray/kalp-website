<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sana bir sorum var 💌</title>
  <meta name="description" content="Cevabını merakla bekliyorum 🥺👉👈">
  <meta property="og:title" content="Sana bir sorum var 💌">
  <meta property="og:description" content="Cevabını merakla bekliyorum 🥺👉👈">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#ffd0e2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💘</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main id="question" class="card">
    <div class="card-cat" id="card-cat"></div>
    <p class="eyebrow">Sana bir sorum var 💌</p>
    <p class="lead">
      Seninle konuşurken zamanın nasıl geçtiğini anlamıyorum.
      Dünya'mın en güzel kızı
    </p>
    <p class="lead">Uzun lafın kısası:</p>
    <h1 id="title">Sevgilim olur musun? 🥺👉👈</h1>
    <div class="buttons">
      <button id="yes" class="btn btn-yes" type="button">Evet 💖</button>
      <button id="no" class="btn btn-no" type="button">Hayır</button>
    </div>
  </main>

  <section id="celebration" class="celebration" hidden>
    <h2>Yaşasııın! 🎉</h2>
    <div class="main-cat" id="main-cat"></div>
    <p class="big">Biliyordum evet diyeceğini 😌💖</p>
    <p class="sub">Artık resmen sevgiliyiz!</p>
    <div class="cat-grid" id="cat-grid"></div>
    <p class="sub love">Seni çok seviyorum 💘</p>

    <div class="gift" id="gift">
      <div class="gift-icon" aria-hidden="true">🎁</div>
      <p class="gift-title">Bu şarkıyı sana hediye ediyorum</p>
      <p class="gift-song" id="gift-song"></p>
      <div class="gift-video"><div id="yt-player"></div></div>
    </div>
  </section>

  <button id="gift-hint" class="gift-hint" type="button" hidden>🎁 Sana bir hediyem var <span aria-hidden="true">↓</span></button>
  <button id="sound" class="sound" type="button" aria-label="Sesi kapat" hidden>🔊</button>
  <div class="confetti" aria-hidden="true"></div>

  <script src="config.js?v=5"></script>
  <script src="script.js?v=5"></script>
</body>
</html>
