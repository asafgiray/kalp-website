<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR Kod 💌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💘</text></svg>">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #5b2141;
      background: linear-gradient(160deg, #ffe3ee, #ffcfe1);
      text-align: center;
    }
    .card { background: #fff; border-radius: 24px; padding: 24px; box-shadow: 0 20px 50px -14px rgba(224, 51, 111, 0.4); max-width: 420px; width: 100%; }
    canvas { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    p { margin: 8px 0; }
    code { word-break: break-all; font-size: 0.9rem; }
    a.btn { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 999px; background: #e0336f; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Okut ve cevapla 💌</h1>
    <p>Bu QR kod şu adrese gider:</p>
    <canvas id="qr" width="1024" height="1024" aria-label="Siteye giden QR kod"></canvas>
    <p><code id="url"></code></p>
    <a class="btn" id="download" download="kalp-qr.png">PNG olarak indir</a>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script>
    // Varsayılan: sitenin ana sayfası. Başka bir adres için: qr.html?url=https://...
    const target = new URLSearchParams(location.search).get("url") || new URL("./", location.href).href;
    document.getElementById("url").textContent = target;

    const qr = qrcode(0, "H");
    qr.addData(target);
    qr.make();

    const canvas = document.getElementById("qr");
    const g = canvas.getContext("2d");
    const n = qr.getModuleCount();
    const quiet = 4;
    const cell = canvas.width / (n + quiet * 2);

    g.fillStyle = "#fff";
    g.fillRect(0, 0, canvas.width, canvas.height);
    g.fillStyle = "#c2185b";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) g.fillRect((c + quiet) * cell, (r + quiet) * cell, cell + 0.5, cell + 0.5);
      }
    }

    // Ortaya kalp (H seviyesi hata düzeltme sayesinde kod yine okunur)
    const mid = canvas.width / 2;
    const badge = canvas.width * 0.17;
    g.fillStyle = "#fff";
    g.beginPath();
    g.arc(mid, mid, badge / 2 + cell * 0.8, 0, Math.PI * 2);
    g.fill();
    const s = badge * 0.42;
    g.fillStyle = "#ff3d7f";
    g.beginPath();
    g.moveTo(mid, mid + s * 0.9);
    g.bezierCurveTo(mid - s * 1.6, mid - s * 0.1, mid - s * 0.7, mid - s * 1.3, mid, mid - s * 0.45);
    g.bezierCurveTo(mid + s * 0.7, mid - s * 1.3, mid + s * 1.6, mid - s * 0.1, mid, mid + s * 0.9);
    g.fill();

    document.getElementById("download").href = canvas.toDataURL("image/png");
  </script>
</body>
</html>
